katze.forcebattle.guidebook.title=ForceBattle Guide
katze.forcebattle.guidebook.author=KatzeGames
katze.forcebattle.guidebook.page.1=<newline><newline><newline><cyan><newline>        Welcome<newline><newline>             to<newline><newline>       ForceBattle</cyan>
katze.forcebattle.guidebook.page.2=<black><gray><bold>How does the battle work?</bold></gray><newline><newline>There are two kinds of points you can earn:<newline><newline><dark_red><bold>- Individual points<newline>- Team points</bold></dark_red><newline><newline>The team with the most points wins.</black>
katze.forcebattle.guidebook.page.3=<black><dark_red><bold>Individual points</bold></dark_red><newline><newline>You receive an objective to complete (e.g. an item, block or height).<newline><newline>Complete it to earn a point and receive another objective.</black>
katze.forcebattle.guidebook.page.4=<black><dark_red><bold>Team points</bold></dark_red><newline><newline>Your team receives an objective that any teammate can complete.<newline><newline>When a teammate completes it, your team earns a point and receives another objective.</black>
katze.forcebattle.guidebook.page.5=<black><bold>Possible objectives include:</bold><newline><newline><blue><bold>Item:</bold></blue><newline>Collect a specific item.<newline><newline><blue><bold>Mob:</bold></blue><newline>Defeat a specific mob.</black>
katze.forcebattle.guidebook.page.6=<black><blue><bold>Biome:</bold></blue><newline>Visit a biome from the specified category.<newline><newline><blue><bold>Advancement:</bold></blue><newline>Complete a specific advancement.</black>
katze.forcebattle.guidebook.page.7=<black><blue><bold>Height:</bold></blue><newline>Reach the specified height.<newline><newline><blue><bold>Coordinates:</bold></blue><newline>Reach the specified coordinates.</black>
katze.forcebattle.guidebook.page.8=<black><blue><bold>Structure:</bold></blue><newline>Visit a structure from the specified category.<newline><newline><blue><bold>Death:</bold></blue><newline>Die in a specific way.<newline><light_gray><italic>(The right death lets you keep your items.)</italic></light_gray></black>
katze.forcebattle.guidebook.page.9=<black><purple><bold>Don't like your assigned task?</bold></purple><newline><newline>Try one of \
  these:<newline><newline><gray><bold>Skip (Barrier):</bold></gray><newline>Skip your current objective and receive a new one.</black>
katze.forcebattle.guidebook.page.10=<black><gray><bold>Swap (Structure Void):</bold></gray><newline>Swap your current objective with a player on another team\
  .<newline><newline><gray><bold>Skip (Recipe Book):</bold></gray><newline>Skip your team's current objective and receive a new one.</black>
katze.forcebattle.guidebook.page.11=<black><gray><bold>Important commands at a glance:</bold></gray><newline><newline><purple><bold>/bp (or /backpack)</bold></purple><newline>...opens the backpack, a shared Ender Chest for everyone on your team.</black>
katze.forcebattle.guidebook.page.12=<black><purple><bold>/chat team</bold></purple><newline>...sets a chat mode where only teammates can see your messages.<newline><newline><purple><bold>/chat all</bold></purple><newline>...sets the normal chat mode. Everyone can see your messages.</black>
katze.forcebattle.guidebook.page.13=<black><purple><bold>/info</bold></purple><newline>...shows the available team objectives (biomes, structures, mobs, deaths).<newline><newline><purple><bold>/recipe [item name]</bold></purple><newline>...shows how to craft your item.</black>
katze.forcebattle.guidebook.page.14=<black><purple><bold>/team create [number]</bold></purple><newline>...creates a team for you and your friends.<newline><newline><newline><purple><bold>/team join [number]</bold></purple><newline>...joins the specified team.</black>
katze.forcebattle.guidebook.page.15=<cyan><bold><newline><newline><newline><newline><newline>       Have fun<newline>        playing!<newline><newline>           :D</bold></cyan>

katze.forcebattle.guidebook.title=ForceBattle-Handbuch
katze.forcebattle.guidebook.author=KatzeGames
katze.forcebattle.guidebook.page.1=<newline><newline><newline><cyan><newline>        Willkommen<newline><newline>            bei<newline><newline>       ForceBattle</cyan>
katze.forcebattle.guidebook.page.2=<black><gray><bold>Wie funktioniert das Battle?</bold></gray><newline><newline>Es gibt zwei Arten von Punkten, die du sammeln kannst:<newline><newline><dark_red><bold>- Individualpunkte<newline>- Teampunkte</bold></dark_red><newline><newline>Gewinner ist das Team mit den meisten gesammelten Punkten.</black>
katze.forcebattle.guidebook.page.3=<black><dark_red><bold>Individualpunkte</bold></dark_red><newline><newline>Du erhältst ein Objective, das du abschließen musst (z.B. Item/Block/Höhe).<newline><newline>Solltest du dieses Objective erfolgreich abschließen, erhältst du einen Punkt und bekommst eine weitere Aufgabe.</black>
katze.forcebattle.guidebook.page.4=<black><dark_red><bold>Teampunkte</bold></dark_red><newline><newline>Du erhältst ein Teamobjective, das jede Person deines Teams erledigen kann.<newline><newline>Sollte eine Person deines Teams das Objective abschließen, erhält dein Team einen Punkt und eine weitere Aufgabe.</black>
katze.forcebattle.guidebook.page.5=<black><bold>Mögliche Aufgaben (Objectives) sind folgende:</bold><newline><newline><blue><bold>Item:</bold></blue><newline>Du musst ein vorgegebenes Item einsammeln.<newline><newline><blue><bold>Mob:</bold></blue><newline>Du musst einen vorgegebenen Mob besiegen.</black>
katze.forcebattle.guidebook.page.6=<black><blue><bold>Biom:</bold></blue><newline>Du musst ein Biom aus der vorgegebenen Kategorie besuchen.<newline><newline><blue><bold>Advancement:</bold></blue><newline>Du musst ein vorgegebenes Advancement erreichen.</black>
katze.forcebattle.guidebook.page.7=<black><blue><bold>Höhe:</bold></blue><newline>Du musst dich auf die vorgegebene Höhe begeben.<newline><newline><blue><bold>Koordinaten:</bold></blue><newline>Du musst die vorgegebene Koordinate(n) erreichen.</black>
katze.forcebattle.guidebook.page.8=<black><blue><bold>Struktur:</bold></blue><newline>Du musst eine Struktur aus der vorgegebenen Kategorie besuchen.<newline><newline><blue><bold>Tod:</bold></blue><newline>Du musst auf eine vorgegebene Art sterben.<newline><light_gray><italic>(Beim richtigen Tod behältst du deine Items.)</italic></light_gray></black>
katze.forcebattle.guidebook.page.9=<black><purple><bold>Du hast keine Lust auf deine zugewiesene Aufgabe?</bold></purple><newline><newline>Versuche es mal mit \
  einem:<newline><newline><gray><bold>Skip (Barrier):</bold></gray><newline>Skippt deine aktuelle Aufgabe und du erhältst eine neue.</black>
katze.forcebattle.guidebook.page.10=<black><gray><bold>Swap (Structure Void):</bold></gray><newline>Swapt deine aktuelle Aufgabe mit der einer anderen Person (aus \
  einem anderen Team).<newline><newline><gray><bold>Skip (Recipe Book):</bold></gray><newline>Skippt deine Teamaufgabe und weist dir eine neue zu.</black>
katze.forcebattle.guidebook.page.11=<black><gray><bold>Die wichtigsten Commands auf einen Blick:</bold></gray><newline><newline><purple><bold>/bp (bzw. /backpack)</bold></purple><newline>...öffnet den Backpack (eine geteilte Enderchest für alle in einem Team).</black>
katze.forcebattle.guidebook.page.12=<black><purple><bold>/chat team</bold></purple><newline>...stellt einen Chatmodus ein, in dem nur Teammitglieder deine Nachrichten sehen können.<newline><newline><purple><bold>/chat all</bold></purple><newline>...stellt den normalen Chatmodus ein (alle sehen deine Nachrichten).</black>
katze.forcebattle.guidebook.page.13=<black><purple><bold>/info</bold></purple><newline>...öffnet ein Menü mit den verschiedenen Teamaufgaben (Biome, Strukturen, Mobs, Tode).<newline><newline><purple><bold>/recipe [Itemname]</bold></purple><newline>...zeigt, wie du dein Item herstellen kannst.</black>
katze.forcebattle.guidebook.page.14=<black><purple><bold>/team create [Zahl]</bold></purple><newline>...erstellt ein Team, in dem du mit Partnern spielen kannst.<newline><newline><newline><purple><bold>/team join [Zahl]</bold></purple><newline>...tritt dem entsprechenden Team bei.</black>
katze.forcebattle.guidebook.page.15=<cyan><bold><newline><newline><newline><newline><newline>   Viel Spaß beim<newline>        Spielen!<newline><newline>           :D</bold></cyan>

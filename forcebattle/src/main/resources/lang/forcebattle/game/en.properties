katze.forcebattle.guide.name=Guide
katze.forcebattle.guide.line.1=Important commands at a glance:
katze.forcebattle.guide.line.2=/bp (or /backpack) → Opens the backpack, a shared Ender Chest for everyone on your team
katze.forcebattle.guide.line.3=/chat team → Only your teammates can see your messages
katze.forcebattle.guide.line.4=/chat all → Everyone can see your messages
katze.forcebattle.guide.line.5=/info → Shows the available team objectives (biomes, structures, mobs, deaths)
katze.forcebattle.guide.line.6=/recipe [item name] → Shows how to craft an item
katze.forcebattle.guide.line.7=How does the battle work?
katze.forcebattle.guide.line.8=You can earn two kinds of points:
katze.forcebattle.guide.line.9=Individual points
katze.forcebattle.guide.line.10=You get an objective to complete (for example, an item, block or height)
katze.forcebattle.guide.line.11=Complete it to earn a point and receive another objective
katze.forcebattle.guide.line.12=Team points
katze.forcebattle.guide.line.13=Your team gets an objective that any teammate can complete to earn a team point
katze.forcebattle.guide.line.14=When a teammate completes it, your team earns a point and gets another objective
katze.forcebattle.guide.line.15=The team with the most points wins
katze.forcebattle.guide.line.16=Possible objectives:
katze.forcebattle.guide.line.17=- Item: Collect a specific item
katze.forcebattle.guide.line.18=- Mob: Defeat a specific mob
katze.forcebattle.guide.line.19=- Biome: Visit a biome from a specified category
katze.forcebattle.guide.line.20=- Advancement: Complete a specific advancement
katze.forcebattle.guide.line.21=- Height: Reach a specific height
katze.forcebattle.guide.line.22=- Coordinates: Reach the specified coordinates
katze.forcebattle.guide.line.23=- Structure: Visit a structure from a specified category
katze.forcebattle.guide.line.24=- Death: Die in a specific way; the right death lets you keep your items
katze.forcebattle.guide.line.25=Don't like your assigned item? Try one of these:
katze.forcebattle.guide.line.26=- Skip (Barrier): Skip your current item and get a new objective
katze.forcebattle.guide.line.27=- Swap (Structure Void): Swap your item with a player on another team
katze.forcebattle.guide.line.28=- Skip (Recipe Book): Skip your team's objective and get a new one
katze.forcebattle.guidebook.title=ForceBattle Guide
katze.forcebattle.guidebook.author=KatzeGames
katze.forcebattle.guidebook.page.1=Welcome to ForceBattle!<newline><newline>Use /menu to configure the game and /start to begin.
katze.forcebattle.guidebook.page.2=Commands<newline><newline>/bp: Open the shared team backpack<newline>/chat team or /chat all: Change chat mode<newline>/info: Browse simplified objectives<newline>/recipe [item]: View a crafting recipe
katze.forcebattle.guidebook.page.3=How to play<newline><newline>Complete objectives to earn points. Individual objectives award personal points; team objectives award points to your team when any member completes them.
katze.forcebattle.guidebook.page.4=Objective types<newline><newline>Collect an item, defeat a mob, visit a biome or structure, complete an advancement, reach a height or coordinates, or die in a specific way.
katze.forcebattle.guidebook.page.5=Winning<newline><newline>The team with the most points wins. Your current objectives and points appear in the scoreboard and beside player names.
katze.forcebattle.guidebook.page.6=Skip<newline><newline>Use the Barrier to skip your current objective. Use the Recipe Book to skip your team's objective. A skipped objective does not award its point.
katze.forcebattle.guidebook.page.7=Swap<newline><newline>Use the Structure Void to swap your objective with a player on another team.
katze.forcebattle.guidebook.page.8=Good luck and have fun!

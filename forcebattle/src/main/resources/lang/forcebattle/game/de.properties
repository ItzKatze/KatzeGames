katze.forcebattle.guide.name=Guide
katze.forcebattle.guide.line.1=Die wichtigsten Befehle auf einen Blick:
katze.forcebattle.guide.line.2=/bp (oder /backpack) → Öffnet den Teamrucksack, eine geteilte Enderkiste für dein Team
katze.forcebattle.guide.line.3=/chat team → Nur deine Teammitglieder können deine Nachrichten sehen
katze.forcebattle.guide.line.4=/chat all → Alle können deine Nachrichten sehen
katze.forcebattle.guide.line.5=/info → Zeigt die verfügbaren Teamaufgaben (Biome, Bauwerke, Kreaturen, Todesarten)
katze.forcebattle.guide.line.6=/recipe [Itemname] -> Zeigt, wie du einen Gegenstand herstellen kannst
katze.forcebattle.guide.line.7=Wie funktioniert der Kampf?
katze.forcebattle.guide.line.8=Du kannst zwei Arten von Punkten sammeln:
katze.forcebattle.guide.line.9=Einzelpunkte
katze.forcebattle.guide.line.10=Du erhältst eine Aufgabe, die du erledigen musst (zum Beispiel einen Gegenstand, Block oder eine Höhe)
katze.forcebattle.guide.line.11=Erledige sie, um einen Punkt und eine weitere Aufgabe zu erhalten
katze.forcebattle.guide.line.12=Teampunkte
katze.forcebattle.guide.line.13=Dein Team erhält eine Aufgabe, die jedes Teammitglied erledigen kann, um einen Teampunkt zu verdienen
katze.forcebattle.guide.line.14=Wenn ein Teammitglied sie erledigt, erhält dein Team einen Punkt und eine weitere Aufgabe
katze.forcebattle.guide.line.15=Das Team mit den meisten Punkten gewinnt
katze.forcebattle.guide.line.16=Mögliche Aufgaben:
katze.forcebattle.guide.line.17=- Gegenstand: Sammle einen bestimmten Gegenstand
katze.forcebattle.guide.line.18=- Kreatur: Besiege eine bestimmte Kreatur
katze.forcebattle.guide.line.19=- Biom: Besuche ein Biom aus einer bestimmten Kategorie
katze.forcebattle.guide.line.20=- Fortschritt: Schließe einen bestimmten Fortschritt ab
katze.forcebattle.guide.line.21=- Höhe: Erreiche eine bestimmte Höhe
katze.forcebattle.guide.line.22=- Koordinaten: Erreiche die angegebenen Koordinaten
katze.forcebattle.guide.line.23=- Bauwerk: Besuche ein Bauwerk aus einer bestimmten Kategorie
katze.forcebattle.guide.line.24=- Todesart: Stirb auf eine bestimmte Weise; beim richtigen Tod behältst du deine Gegenstände
katze.forcebattle.guide.line.25=Dir gefällt dein Gegenstand nicht? Probiere einen dieser Befehle:
katze.forcebattle.guide.line.26=- Skip (Barriere): Überspringe deinen Gegenstand und erhalte eine neue Aufgabe
katze.forcebattle.guide.line.27=- Swap (Strukturleere): Tausche deinen Gegenstand mit jemandem aus einem anderen Team
katze.forcebattle.guide.line.28=- Skip (Rezeptbuch): Überspringe die Teamaufgabe und erhalte eine neue
katze.forcebattle.guidebook.title=ForceBattle-Handbuch
katze.forcebattle.guidebook.author=KatzeGames
katze.forcebattle.guidebook.page.1=Willkommen bei ForceBattle!<newline><newline>Mit /menu kannst du das Spiel einstellen und mit /start beginnt der Kampf.
katze.forcebattle.guidebook.page.2=Befehle<newline><newline>/bp: Öffnet den gemeinsamen Teamrucksack<newline>/chat team oder /chat all: Ändert den Chatmodus<newline>/info: Zeigt vereinfachte Aufgaben<newline>/recipe [Item]: Zeigt ein Herstellungsrezept
katze.forcebattle.guidebook.page.3=Spielablauf<newline><newline>Erledige Aufgaben, um Punkte zu sammeln. Einzelaufgaben bringen persönliche Punkte. Für Teamaufgaben erhält dein Team Punkte, sobald ein Mitglied sie erledigt.
katze.forcebattle.guidebook.page.4=Aufgabentypen<newline><newline>Sammle einen Gegenstand, besiege eine Kreatur, besuche ein Biom oder Bauwerk, schließe einen Fortschritt ab, erreiche eine Höhe oder Koordinaten oder stirb auf eine bestimmte Weise.
katze.forcebattle.guidebook.page.5=Sieg<newline><newline>Das Team mit den meisten Punkten gewinnt. Deine Aufgaben und Punkte stehen in der Übersicht und neben Spielernamen.
katze.forcebattle.guidebook.page.6=Überspringen<newline><newline>Mit der Barriere überspringst du deine Aufgabe. Mit dem Rezeptbuch überspringst du die Teamaufgabe. Übersprungene Aufgaben bringen keinen Punkt.
katze.forcebattle.guidebook.page.7=Tauschen<newline><newline>Mit der Strukturleere kannst du deine Aufgabe mit einem Spieler aus einem anderen Team tauschen.
katze.forcebattle.guidebook.page.8=Viel Erfolg und viel Spaß!
